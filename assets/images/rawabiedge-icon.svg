<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="128" ry="128" fill="url(#grad1)" />
  
  <!-- Text "RE" -->
  <text x="50%" y="50%" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="280" fill="url(#gradText)" text-anchor="middle" dy=".35em">RE</text>
  
  <!-- Creative Accent Line -->
  <path d="M120 400 L392 400" stroke="#4ade80" stroke-width="20" stroke-linecap="round" opacity="0.6" />
</svg>
